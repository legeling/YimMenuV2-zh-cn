name: Chinese Release

on:
  push:
    tags:
      - "v*.*.*-zh-cn"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-compilation:
    runs-on: windows-latest
    name: Build and validate Windows DLL
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Match tag to VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}-zh-cn"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "${expected}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}; expected ${expected}" >&2
            exit 1
          fi

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Generate CMake project
        run: cmake -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "-DYIMMENU_BUILD_TAG=${{ github.ref_name }}" -DCMAKE_BUILD_TYPE=RelWithDebInfo -S . -B build -G Ninja

      - name: Build 64bit RelWithDebInfo DLL
        run: cmake --build ./build --config RelWithDebInfo --target YimMenuV2 --

      - name: Report compiler cache stats
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats

      - name: Validate and version build outputs
        shell: pwsh
        run: |
          $dll = "build/YimMenuV2.dll"
          $pdb = "build/YimMenuV2.pdb"
          if (-Not (Test-Path -Path $dll -PathType Leaf)) { throw "Missing build output: $dll" }
          if (-Not (Test-Path -Path $pdb -PathType Leaf)) { throw "Missing build output: $pdb" }
          $stream = [System.IO.File]::OpenRead($dll)
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
              throw "Build output is not a Windows PE file: $dll"
            }
          } finally {
            $stream.Dispose()
          }
          Move-Item $dll "build/YimMenuV2-${{ github.ref_name }}.dll"
          Move-Item $pdb "build/YimMenuV2-${{ github.ref_name }}.pdb"

      - name: Upload validated build
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/YimMenuV2-${{ github.ref_name }}.dll
            build/YimMenuV2-${{ github.ref_name }}.pdb
          if-no-files-found: error
          retention-days: 14

  create-release:
    runs-on: ubuntu-latest
    name: Create Chinese Release
    needs: native-compilation
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ github.ref_name }}-${{ github.sha }}

      - name: Generate build SHA256
        id: build_sha
        run: |
          sha256sum YimMenuV2-${{ github.ref_name }}.dll > sha256.checksum
          echo "build_sha=$(cat sha256.checksum)" >> "$GITHUB_OUTPUT"
          cat sha256.checksum

      - name: Chinese Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          name: zh-cn build ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            **This release has been built by GitHub Actions**
            [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Build SHA256:
            ```
            ${{ steps.build_sha.outputs.build_sha }}
            ```
            To verify the build SHA256 during the action, open the build link and read the Generate build SHA256 step.

            You can download the workflow artifact, generate a SHA256 checksum and compare it with the release binary.
            Workflow artifacts are not automatically identical to release assets because release assets can be modified afterwards.

            This build is provided for testing purposes only:
            - Test whether the build environment produces a working YimMenuV2 DLL
            - Test whether the source remains compatible with the current version of Grand Theft Auto V: Enhanced

            If you use this menu as-is, you are on your own and no warranty is provided.

            Full Commit Hash:
            ```
            ${{ github.sha }}
            ```
          files: YimMenuV2-${{ github.ref_name }}.dll
